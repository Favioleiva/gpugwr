name: CPU installation and reproducibility
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r Colab/requirements-cpu.txt build pytest
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -I tests/installed_contract04_probe.py
      - run: python -m pytest tests/test_contract04.py -q
      - run: python -m pip check
